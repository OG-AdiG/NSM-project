services:
  postgres:
    image: postgres:16-alpine
    container_name: nsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nsm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nsm}
    ports:
      # 5433 na hoście – 5432 często zajęte przez inne projekty
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nsm} -d ${POSTGRES_DB:-nsm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nsm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Oficjalne minio/minio i quay.io/minio są niedostępne (2025/2026)
    image: bitnamilegacy/minio:2024.6.13
    container_name: nsm-minio
    restart: unless-stopped
    command: minio server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker/data/minio:/bitnami/minio/data



  mailpit:
    image: axllent/mailpit:latest
    container_name: nsm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
